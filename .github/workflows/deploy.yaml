name: Deploy Jitsi website to AWS S3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the website to"
        required: true
        type: choice
        options:
          - dev
          - live
        default: dev
      purge_cache:
        description: "Purge Cloudflare cache"
        required: false
        type: boolean
        default: false

jobs:
  deploy-website-to-s3:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    env:
      S3_BUCKET_NAME: ${{ vars.AWS_JITSI_S3_BUCKET_NAME_PREFIX }}-${{ inputs.environment }}-${{ secrets.AWS_ACCOUNT_ID}}-${{ vars.AWS_REGION }}-an

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_CLOUDFLARE_USER_API_TOKEN }} > CLOUDFLARE_API_TOKEN
            ${{ vars.BITWARDEN_UUID_CLOUDFLARE_ZONE_ID }} > CLOUDFLARE_ZONE_ID
          set_env: true

      - name: Install dependencies
        run: npm ci

      - name: Dynamically build the environment file
        run: |
          cat <<EOF > "src/environments/environment.${{ inputs.environment }}.ts"
          export const environment = {
            production: true,
            apiUrl: "${{ vars.TOAB_JITSI_MODERATOR_API_URL }}"
          };
          EOF

      - name: Build website
        run: npm run build -- --configuration ${{ inputs.environment }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_JITSI_S3_DEPLOY_ROLE_NAME }}-${{ inputs.environment }}

      - name: Deploy website to S3
        run: |
          # Sync all assets EXCEPT html files Cache these forever (1 year)
          aws s3 sync dist/toab-jitsi-website/browser/ "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "max-age=31536000, public"

          # Sync ONLY html files with strict NO CACHING
          aws s3 sync dist/toab-jitsi-website/browser/ "s3://${S3_BUCKET_NAME}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
            --content-type text/html

      - name: Purge cloudflare cache
        if: ${{ inputs.purge_cache }}
        run: |
          curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${{ env.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ env.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
