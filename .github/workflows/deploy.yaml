name: Deploy Jitsi website to AWS S3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the website to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

jobs:
  deploy-website-to-s3:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ inputs.environment }}
      AWS_REGION: eu-central-1
      S3_BUCKET_NAME: ${{ secrets.AWS_JITSI_S3_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_JITSI_S3_DEPLOY_ROLE_NAME }}

      - name: Deploy website to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" --delete
