name: Deploy Jitsi website to AWS S3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the website to"
        required: true
        type: choice
        options:
          - dev
          - live
        default: dev
      purge_cache:
        description: "Purge Cloudflare cache"
        required: false
        type: boolean
        default: false

jobs:
  deploy-website-to-s3:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    env:
      S3_BUCKET_NAME: ${{ vars.AWS_JITSI_S3_BUCKET_NAME_PREFIX }}-${{ inputs.environment }}-${{ secrets.AWS_ACCOUNT_ID}}-${{ vars.AWS_REGION }}-an

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the sitemap's <lastmod> reflects each page's last commit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_CLOUDFLARE_USER_API_TOKEN }} > CLOUDFLARE_API_TOKEN
            ${{ vars.BITWARDEN_UUID_CLOUDFLARE_ZONE_ID }} > CLOUDFLARE_ZONE_ID
          set_env: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      # apiUrl, siteUrl, cdnUrl and indexable all come from the committed
      # src/environments/environment.<env>.ts, the single source of truth for each environment.
      - name: Build website
        run: npm run build -- --configuration ${{ inputs.environment }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_JITSI_S3_DEPLOY_ROLE_NAME }}-${{ inputs.environment }}

      - name: Deploy website to S3
        run: |
          DIST=dist/toab-jitsi-website/browser

          # Pre-rendered routes (e.g. privacy/index.html -> privacy). Each is also uploaded
          # as an extension-less object so /privacy returns the static HTML with a 200
          # instead of a redirect or the SPA fallback. Excluded below so --delete keeps them.
          ROUTES=$(cd "$DIST" && find . -mindepth 2 -name index.html | sed 's|^\./||; s|/index.html$||')
          ROUTE_EXCLUDES=()
          for route in $ROUTES; do ROUTE_EXCLUDES+=(--exclude "$route"); done

          # Sync all assets EXCEPT html files Cache these forever (1 year)
          aws s3 sync "$DIST/" "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            "${ROUTE_EXCLUDES[@]}" \
            --cache-control "max-age=31536000, public"

          # Sync ONLY html files with strict NO CACHING
          aws s3 sync dist/toab-jitsi-website/browser/ "s3://${S3_BUCKET_NAME}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
            --content-type text/html

          for route in $ROUTES; do
            aws s3 cp "$DIST/$route/index.html" "s3://${S3_BUCKET_NAME}/$route" \
              --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
              --content-type text/html
          done

          # Crawler files must not be cached for a year, or sitemap updates go unseen.
          # sitemap.xml only exists for indexable (live) builds.
          aws s3 cp "$DIST/robots.txt" "s3://${S3_BUCKET_NAME}/robots.txt" \
            --cache-control "max-age=3600, public" --content-type text/plain
          if [ -f "$DIST/sitemap.xml" ]; then
            aws s3 cp "$DIST/sitemap.xml" "s3://${S3_BUCKET_NAME}/sitemap.xml" \
              --cache-control "max-age=3600, public" --content-type application/xml
          else
            aws s3 rm "s3://${S3_BUCKET_NAME}/sitemap.xml"
          fi

      - name: Purge cloudflare cache
        if: ${{ inputs.purge_cache }}
        run: |
          curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${{ env.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ env.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

      # IndexNow tells Bing (and through it DuckDuckGo, Yandex, Seznam, Naver) about
      # updated URLs immediately. Google ignores IndexNow, so this has no effect there.
      # Runs only for indexable builds, i.e. when the post-build step wrote a sitemap.
      - name: Notify search engines via IndexNow
        continue-on-error: true
        run: |
          DIST=dist/toab-jitsi-website/browser
          if [ ! -f "$DIST/sitemap.xml" ]; then
            echo "Build is not indexable; skipping IndexNow"
            exit 0
          fi
          KEY=$(basename "$(ls "$DIST"/*.txt | grep -E '/[0-9a-f]{32}\.txt$')" .txt)
          URLS=$(grep -o '<loc>[^<]*' "$DIST/sitemap.xml" | sed 's/<loc>//' | jq -R . | jq -s .)
          SITE=$(echo "$URLS" | jq -r '.[0]' | sed 's|/$||')
          HOST=${SITE#https://}
          jq -n --arg host "$HOST" --arg key "$KEY" --arg site "$SITE" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: "\($site)/\($key).txt", urlList: $urls}' > indexnow.json
          cat indexnow.json
          curl --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json
