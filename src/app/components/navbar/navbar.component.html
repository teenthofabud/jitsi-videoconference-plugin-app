<nav class="bg-white border-b border-neutral-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a routerLink="/" class="flex items-center hover:opacity-90 transition-opacity">
                <img [ngSrc]="logoUrl" width="148" height="40" priority [alt]="siteName" class="h-10 w-auto" />
            </a>

            <!-- Desktop Menu -->
            <div class="hidden lg:flex items-center gap-8">
                <ng-container *ngTemplateOutlet="menuLinks; context: { $implicit: 'flex items-center gap-2 text-neutral-700 hover:text-primary-600 transition-colors font-medium' }" />
            </div>

            <!-- Mobile Menu Button -->
            <button
                hlmBtn
                variant="ghost"
                size="icon"
                (click)="toggleMobileMenu()"
                class="lg:hidden"
                [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'"
            >
                @if (!mobileMenuOpen) {
                    <svg class="w-6 h-6 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                } @else {
                    <svg class="w-6 h-6 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                }
            </button>
        </div>

        <!-- Mobile Menu -->
        <div [class.hidden]="!mobileMenuOpen" class="lg:hidden">
            <hlm-separator />
            <ng-container *ngTemplateOutlet="menuLinks; context: { $implicit: 'flex items-center gap-3 px-4 py-3 text-neutral-700 hover:bg-neutral-50 hover:text-primary-600 transition-colors font-medium' }" />
        </div>
    </div>
</nav>

<!-- Menu items, shared by the desktop and mobile menus, which differ only in link styling -->
<ng-template #menuLinks let-linkClass>
    @for (item of items; track item.label) {
        @if (item.route) {
            <a [routerLink]="item.route" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: !!item.exact }"
               (click)="closeMobileMenu()"
               [class]="linkClass">
                <ng-container *ngTemplateOutlet="linkContent; context: { $implicit: item }" />
            </a>
        } @else {
            <a (click)="scrollToContact()" [class]="linkClass + ' cursor-pointer'">
                <ng-container *ngTemplateOutlet="linkContent; context: { $implicit: item }" />
            </a>
        }
    }
</ng-template>

<ng-template #linkContent let-item>
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
    </svg>
    <span>{{ item.label }}</span>
</ng-template>
