<div class="page-container">
    <div class="page-header">
        <h1>{{ termsData.title }}</h1>
        <p class="page-subtitle">Last updated: {{ termsData.lastUpdated }}</p>
    </div>

    <div class="page-content">
        <section class="content-section" *ngFor="let section of termsData.sections">
            <h2>{{ section.title }}</h2>
            <ul class="content-list">
                <li *ngFor="let item of section.items">{{ item }}</li>
            </ul>
        </section>
    </div>
</div>
