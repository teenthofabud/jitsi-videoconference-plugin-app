<div class="page-container">
    <div class="page-header">
        <h1>{{ privacyData.title }}</h1>
        <p class="page-subtitle">Last updated: {{ privacyData.lastUpdated }}</p>
    </div>

    <div class="page-content">
        <section class="content-section" *ngFor="let section of privacyData.sections">
            <h2>{{ section.title }}</h2>
            <ul class="content-list">
                <li *ngFor="let item of section.items">{{ item }}</li>
            </ul>
        </section>
    </div>
</div>
