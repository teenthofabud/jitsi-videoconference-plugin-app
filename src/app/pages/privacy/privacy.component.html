<app-legal-page [title]="privacyData.title" [lastUpdated]="privacyData.lastUpdated">
    @for (section of privacyData.sections; track section.title; let first = $first) {
        @if (!first) {
            <hlm-separator class="my-8" />
        }
        <section>
            <h2 class="text-2xl font-semibold text-neutral-900 mb-4">{{ section.title }}</h2>
            <ul class="list-disc ps-5 space-y-3">
                @for (item of section.items; track item) {
                    <li>{{ item }}</li>
                }
            </ul>
        </section>
    }
</app-legal-page>
