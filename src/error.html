<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Something went wrong | TOAB Jitsi Plugin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover-color: #045ff1;

      --page-bg: #f7f7f7;
      --text-heading: #374151;
      --text-body: #6b7280;
      --text-soft: #8a8f98;

      --button-bg: #ffffff;
      --button-border: #d1d5db;
      --button-hover-bg: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        sans-serif;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text-body);
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .page-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .brand-header {
      display: flex;
      justify-content: center;
      padding: clamp(36px, 7vh, 72px) 24px 0;
    }

    .brand {
      margin: 0;
      color: #1d4ed8;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .content-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-page {
      width: 100%;
      max-width: 760px;
      text-align: center;
      transform: translateY(-24px);
    }

    .error-title {
      margin: 0;
      color: var(--text-heading);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .error-message {
      max-width: 720px;
      margin: 18px auto 0;
      color: var(--text-body);
      font-size: 1rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.05rem;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        color 150ms ease,
        box-shadow 150ms ease;
    }

    .button-primary {
      color: #ffffff;
      background: var(--primary-color);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.14);
    }

    .button-primary:hover {
      background: var(--primary-hover-color);
    }

    .button-secondary {
      color: var(--text-heading);
      background: var(--button-bg);
      border-color: var(--button-border);
    }

    .button-secondary:hover {
      background: var(--button-hover-bg);
    }

    .support-text {
      max-width: 680px;
      margin: 26px auto 0;
      color: var(--text-soft);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .brand-header {
        justify-content: flex-start;
        padding: 36px 18px 0;
      }

      .brand {
        font-size: 1.35rem;
        white-space: normal;
      }

      .content-wrap {
        align-items: flex-start;
        padding: 72px 18px 24px;
      }

      .error-page {
        text-align: left;
        transform: none;
      }

      .error-message,
      .support-text {
        margin-left: 0;
        margin-right: 0;
      }

      .actions {
        flex-direction: column;
        justify-content: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="brand-header">
      <p class="brand">TOAB Jitsi Plugin</p>
    </header>

    <main class="content-wrap">
      <section class="error-page" aria-labelledby="error-title">
        <h1 id="error-title" class="error-title">Something went wrong</h1>

        <p class="error-message">
          We’re unable to load this page right now. Please try again.
        </p>

        <div class="actions" aria-label="Recovery actions">
          <a class="button button-primary" href="/">Go to home</a>
          <a class="button button-secondary" href="javascript:location.reload()">Try again</a>
        </div>

        <p class="support-text">
          If this keeps happening, please contact support and share the page URL.
        </p>
      </section>
    </main>
  </div>
</body>

</html>
