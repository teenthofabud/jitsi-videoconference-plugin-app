server_tokens off;

# Pre-rendered HTML must always be revalidated so a redeploy shows up at once;
# robots.txt and sitemap.xml are re-read hourly so crawlers see updates soon.
# Set via `expires` rather than add_header: an add_header inside a location
# would silently drop every security header inherited from the server block.
map $sent_http_content_type $cache_expires {
    default             off;
    ~^text/html         epoch;
    ~^text/plain        1h;
    ~^application/xml   1h;
}

server {
    listen 8080;
    server_name _;

    # TLS is the only way in — plain HTTP just redirects.
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/example.com+5.pem;
    ssl_certificate_key /etc/nginx/tls/example.com+5-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    expires $cache_expires;

    # Defines $csp_script_hashes (hashes of the inline scripts and handlers in
    # the pre-rendered pages), $csp_cdn_origin (this build's CDN) and
    # $csp_api_origin (this build's API), all generated with the build by
    # scripts/csp-sources.mjs — so the CSP always matches the build it ships
    # with, and nothing is substituted at container start.
    include /etc/nginx/snippets/csp-sources.conf;

    # --- Security headers (everything except auth — this app ships without
    # authentication per Standing Decisions #9; these are all response-header
    # hardening, no login/session mechanism attached) ---

    # Forces HTTPS on every future visit for a year, including subdomains —
    # safe here because TLS is the only listener a client can reach.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Clickjacking: refuse to be framed by anyone (frame-ancestors covers modern
    # browsers, X-Frame-Options is the fallback for older ones).
    add_header X-Frame-Options "DENY" always;

    # XSS-amplification: browser won't MIME-sniff a response into executing as
    # script/CSS, and CSP restricts where scripts/styles/connections can come
    # from.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy reflected-XSS filter — a no-op in modern evergreen browsers
    # (which dropped it in favor of CSP) but harmless, and still respected by
    # some older/embedded browser engines.
    add_header X-XSS-Protection "1; mode=block" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Isolates this browsing context from cross-origin windows it opens/is
    # opened by (Spectre-class mitigations); same-origin is safe since this
    # app doesn't rely on window.opener cross-origin communication.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Refuses to let other origins embed this app's own responses (scripts,
    # styles, the SPA shell) via <script src>/<img>/fetch with no-cors.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Denies browser features this app never uses; add to the list if a
    # feature is intentionally adopted later.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # style-src still needs 'unsafe-inline' for Angular's runtime style
    # injection — dropping it requires moving to a nonce-based CSP (a fresh
    # nonce minted per request and threaded into index.html), which this
    # static SPA build doesn't do yet.
    #
    # Third-party origins: Google Fonts serves the Inter stylesheet from
    # fonts.googleapis.com and the font files from fonts.gstatic.com; the
    # logo comes from the environment's toab-jitsi CDN bucket on S3, and
    # connect-src allows the environment's API.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: $csp_cdn_origin; connect-src 'self' $csp_api_origin; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        # Pre-rendered routes are served as their own static page (/privacy ->
        # privacy/index.html), checked directly rather than via $uri/ so nginx
        # doesn't 301 /privacy to /privacy/ and split the canonical URL.
        # Any other path falls back to index.csr.html, the un-rendered app
        # shell — not index.html, which is the pre-rendered home page and
        # would flash home content before the router takes over.
        try_files $uri $uri/index.html /index.csr.html;
    }
}
